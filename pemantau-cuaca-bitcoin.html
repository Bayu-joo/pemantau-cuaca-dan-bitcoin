<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemantau Cuaca & Bitcoin</title>
<style>
:root{--bg:#e9eef5;--card:#fff;--ink:#14213d;--muted:#5b6b85;--line:#d3dbe8;--sky:#2f6fed;--btc:#f08c00;--up:#13815b;--down:#c23a3a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1726;--card:#18233a;--ink:#e8eefb;--muted:#9aa9c4;--line:#2a3a5a;--sky:#6ea0ff;--btc:#ffb02e;--up:#4cd9a0;--down:#ff8585}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:920px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-size:1rem;margin:0 0 14px;color:var(--muted);font-weight:600}
.big{font-size:2.6rem;font-weight:700;line-height:1.1;margin:0}
.weather .big{color:var(--sky)}.btc .big{color:var(--btc);font-size:2.1rem}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:.9rem}
.row b{color:var(--ink)}
form{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit}
button{padding:8px 14px;border:0;border-radius:8px;background:var(--sky);color:#fff;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px;text-align:center;font-size:.82rem}
.days div{border:1px solid var(--line);border-radius:8px;padding:8px 2px}
.days span{display:block;color:var(--muted)}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}
svg{width:100%;height:90px;margin-top:14px;display:block}
.err{color:var(--down);font-size:.9rem;margin:8px 0 0}
footer{margin-top:16px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>Pemantau Cuaca & Bitcoin</h1>
<p class="sub" id="updated">Memuat data…</p>
<div class="grid">
  <section class="card weather" aria-live="polite">
    <h2>Cuaca</h2>
    <form id="cityForm"><input id="city" aria-label="Nama kota" placeholder="Cari kota, mis. Bandung"><button>Cari</button></form>
    <div id="place" class="sub" style="margin:0 0 6px"></div>
    <p class="big" id="temp">–</p>
    <div id="desc" style="margin-top:4px">–</div>
    <div class="row"><span>Terasa <b id="feel">–</b></span><span>Lembap <b id="hum">–</b></span><span>Angin <b id="wind">–</b></span></div>
    <div class="days" id="days"></div>
    <p class="err" id="werr" hidden></p>
  </section>
  <section class="card btc" aria-live="polite">
    <h2>Bitcoin (BTC)</h2>
    <p class="big" id="idr">–</p>
    <div class="row"><span>USD <b id="usd">–</b></span><span>24 jam <b id="chg" class="chg">–</b></span></div>
    <svg id="spark" viewBox="0 0 300 90" preserveAspectRatio="none" role="img" aria-label="Grafik harga Bitcoin 7 hari"></svg>
    <div class="sub" style="margin:6px 0 0">Harga 7 hari terakhir (USD)</div>
    <p class="err" id="berr" hidden></p>
  </section>
</div>
<footer>Data: Open-Meteo dan CoinGecko. Diperbarui otomatis tiap 60 detik. Buka file ini langsung di browser agar data langsung termuat.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const WMO = {0:"Cerah",1:"Cerah berawan",2:"Berawan sebagian",3:"Mendung",45:"Berkabut",48:"Berkabut",51:"Gerimis ringan",53:"Gerimis",55:"Gerimis lebat",61:"Hujan ringan",63:"Hujan",65:"Hujan lebat",80:"Hujan lokal",81:"Hujan lokal lebat",82:"Hujan sangat lebat",95:"Badai petir",96:"Badai petir",99:"Badai petir"};
const wmo = c => WMO[c] || "Tidak diketahui";
let place = {name:"Jakarta", lat:-6.2146, lon:106.8451};
try { const s = JSON.parse(localStorage.getItem("place")); if (s && s.lat) place = s; } catch(e){}

async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error(r.status); return r.json(); }

async function loadWeather(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=5`;
    const d = await getJSON(u), c = d.current;
    $("place").textContent = place.name;
    $("temp").textContent = Math.round(c.temperature_2m) + "°C";
    $("desc").textContent = wmo(c.weather_code);
    $("feel").textContent = Math.round(c.apparent_temperature) + "°C";
    $("hum").textContent = c.relative_humidity_2m + "%";
    $("wind").textContent = Math.round(c.wind_speed_10m) + " km/j";
    $("days").innerHTML = d.daily.time.map((t,i)=>{
      const day = new Date(t+"T00:00").toLocaleDateString("id-ID",{weekday:"short"});
      return `<div><span>${day}</span>${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°<span>${wmo(d.daily.weather_code[i])}</span></div>`;
    }).join("");
    $("werr").hidden = true;
  }catch(e){ $("werr").hidden = false; $("werr").textContent = "Cuaca gagal dimuat. Periksa koneksi internet lalu coba lagi."; }
}

async function loadBtc(){
  try{
    const p = await getJSON("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=idr,usd&include_24hr_change=true");
    const b = p.bitcoin;
    $("idr").textContent = "Rp " + Math.round(b.idr).toLocaleString("id-ID");
    $("usd").textContent = "$" + Math.round(b.usd).toLocaleString("en-US");
    const ch = b.usd_24h_change;
    $("chg").textContent = (ch>=0?"▲ ":"▼ ") + Math.abs(ch).toFixed(2) + "%";
    $("chg").className = "chg " + (ch>=0?"up":"down");
    const h = await getJSON("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=7");
    drawSpark(h.prices.map(x=>x[1]));
    $("berr").hidden = true;
  }catch(e){ $("berr").hidden = false; $("berr").textContent = "Harga Bitcoin gagal dimuat. Batas permintaan API mungkin tercapai; tunggu sebentar."; }
}

function drawSpark(v){
  const min = Math.min(...v), max = Math.max(...v), r = max-min || 1;
  const pts = v.map((y,i)=>`${(i/(v.length-1))*300},${84-((y-min)/r)*78}`).join(" ");
  $("spark").innerHTML = `<polyline points="${pts}" fill="none" stroke="var(--btc)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

async function refresh(){
  await Promise.all([loadWeather(), loadBtc()]);
  $("updated").textContent = "Terakhir diperbarui " + new Date().toLocaleTimeString("id-ID");
}

$("cityForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const q = $("city").value.trim(); if(!q) return;
  try{
    const g = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=id`);
    if(!g.results){ $("werr").hidden=false; $("werr").textContent = `Kota "${q}" tidak ditemukan. Coba nama lain.`; return; }
    const r = g.results[0];
    place = {name: r.name + (r.country ? ", " + r.country : ""), lat: r.latitude, lon: r.longitude};
    try{ localStorage.setItem("place", JSON.stringify(place)); }catch(e){}
    $("city").value = ""; loadWeather();
  }catch(e){ $("werr").hidden=false; $("werr").textContent = "Pencarian kota gagal. Periksa koneksi internet."; }
});

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
